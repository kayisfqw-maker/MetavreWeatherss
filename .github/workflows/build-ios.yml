name: Build iPhone IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Flutter 3.44.8 kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          flet --version

      - name: Apple sertifikasını yükle
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > distribution.p12
          test -s distribution.p12

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import distribution.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Provisioning Profile yükle
        id: profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          test -s profile.mobileprovision

          security cms -D -i profile.mobileprovision > profile.plist

          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" profile.plist)
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" profile.plist)

          cp profile.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "PROFILE_UUID=$UUID" >> "$GITHUB_OUTPUT"

          echo "Provisioning Profile: $NAME"
          echo "UUID: $UUID"

      - name: Gerçek iPhone IPA oluştur
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          test -n "$IOS_TEAM_ID"

          flet build ipa \
            --verbose \
            --bundle-id com.metevra.weather \
            --build-version 1.0.0 \
            --build-number "${{ github.run_number }}" \
            --permissions location \
            --ios-team-id "$IOS_TEAM_ID" \
            --ios-signing-certificate "Apple Distribution" \
            --ios-provisioning-profile "${{ steps.profile.outputs.PROFILE_UUID }}" \
            --ios-export-method app-store-connect

      - name: IPA'yı kaydet
        uses: actions/upload-artifact@v4
        with:
          name: metevra-weather-iphone-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error

      - name: Gizli dosyaları temizle
        if: always()
        run: |
          rm -f distribution.p12
          rm -f profile.mobileprovision
          rm -f profile.plist
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
