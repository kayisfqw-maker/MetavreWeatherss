name: Build iOS Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Flutter 3.44.8 kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Flutter kontrol
        run: |
          flutter --version
          flutter doctor

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          flet --version

      - name: iOS Simulator build
        run: |
          flet build ios-simulator \
            --verbose \
            --bundle-id com.metevra.weather

      - name: Build dosyalarını kontrol et
        run: |
          echo "=== BUILD ==="
          find build -maxdepth 5 -type f | head -100

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: metevra-weather-ios-test
          path: build/ios-simulator/**
          if-no-files-found: error
