name: Build Signed Google Play AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java JDK 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload keystore'u oluştur
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          test -s upload-keystore.jks

      - name: Google Play için imzalı AAB oluştur
        env:
          FLET_ANDROID_SIGNING_KEY_STORE: upload-keystore.jks
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          yes | flet build aab             --verbose             --bundle-id com.metevra.weather             --build-version 1.0.0             --build-number "${{ github.run_number }}"             --permissions location             --android-adaptive-icon-background "#142C5C"

      - name: AAB artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: metevra-weather-release-aab
          path: build/aab/*.aab
          if-no-files-found: error

      - name: Keystore'u sil
        if: always()
        run: rm -f upload-keystore.jks
