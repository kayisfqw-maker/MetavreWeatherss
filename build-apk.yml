name: Build iOS Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Flet kurulumunu kontrol et
        run: |
          flet --version
          python --version

      - name: iOS Simulator build
        run: |
          flet build ios-simulator \
            --verbose \
            --bundle-id com.metevra.weather

      - name: Build dosyalarını göster
        run: |
          find build -maxdepth 4 -type f | head -100
